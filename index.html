<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMK Documentary Overlay</title>
    <style>
        /* پێناسەکردنی فۆنتی نوی لە گیتهەپ */
        @font-face {
            font-family: 'IMKFontRegular';
            src: url('IMKFontRegular-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'IMKFontRegular', sans-serif;
        }

        .title-container {
            font-family: 'IMKFontRegular', sans-serif;
            direction: rtl;
            text-align: right;
        }

        .main-text {
            font-size: 36px;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="title-container">
        <h1 class="main-text">هەموو وەرزشێک</h1>
    </div>

</body>
</html>
